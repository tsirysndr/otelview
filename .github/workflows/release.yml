name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build web UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Fetch pre-built static libduckdb
        run: ./scripts/fetch-duckdb.sh

      - name: Build otelview
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSET="otelview-${TAG}-${{ matrix.target }}.tar.gz"
          tar -czf "$ASSET" -C "target/${{ matrix.target }}/release" otelview
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          generate_release_notes: true

  desktop:
    name: desktop ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
            bundles: dmg
          - os: ubuntu-24.04
            platform: linux-x86_64
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux webkit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install UI deps
        working-directory: ui
        run: npm ci

      - name: Build desktop app (ad-hoc signed on macOS)
        working-directory: ui
        env:
          # "-" = macOS ad-hoc signature: no Apple developer certificate
          # needed; users bypass Gatekeeper with right-click → Open.
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Collect artifacts
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p out
          BUNDLE=ui/src-tauri/target/release/bundle
          if [ "${{ matrix.platform }}" = "macos-arm64" ]; then
            cp "$BUNDLE"/dmg/*.dmg "out/otelview-desktop-${TAG}-macos-arm64.dmg"
          else
            cp "$BUNDLE"/appimage/*.AppImage "out/otelview-desktop-${TAG}-linux-x86_64.AppImage"
            cp "$BUNDLE"/deb/*.deb "out/otelview-desktop-${TAG}-linux-x86_64.deb"
          fi
          (cd out && shasum -a 256 * > SHA256SUMS-desktop-${{ matrix.platform }}.txt)

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
