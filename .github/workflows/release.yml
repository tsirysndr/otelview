name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload to (e.g. v0.1.0)"
        required: true

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build web UI
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Fetch pre-built static libduckdb
        run: ./scripts/fetch-duckdb.sh

      - name: Build otelview
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          TAG="${RELEASE_TAG}"
          ASSET="otelview-${TAG}-${{ matrix.target }}.tar.gz"
          tar -czf "$ASSET" -C "target/${{ matrix.target }}/release" otelview
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Build deb and rpm packages (nfpm)
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          case "${{ matrix.target }}" in
            x86_64-*)  NFPM_ARCH=amd64 ;;
            aarch64-*) NFPM_ARCH=arm64 ;;
          esac
          mkdir -p dist
          export VERSION NFPM_ARCH TARGET
          envsubst '$VERSION $NFPM_ARCH $TARGET' < nfpm.yaml > nfpm.generated.yaml
          cat nfpm.generated.yaml
          docker run --rm -v "$PWD:/work" -w /work \
            goreleaser/nfpm package -f nfpm.generated.yaml -p deb -t dist/
          docker run --rm -v "$PWD:/work" -w /work \
            goreleaser/nfpm package -f nfpm.generated.yaml -p rpm -t dist/
          rm nfpm.generated.yaml
          (cd dist && shasum -a 256 * > "SHA256SUMS-packages-$NFPM_ARCH.txt")
          ls -la dist/

      - name: Check Gemfury secrets
        if: runner.os == 'Linux'
        id: gemfury
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
        run: |
          if [ -n "$FURY_TOKEN" ] && [ -n "$FURY_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Gemfury secrets not set; skipping package upload"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
            dist/*
          generate_release_notes: true
      - name: Push deb and rpm to Gemfury
        if: runner.os == 'Linux' && steps.gemfury.outputs.available == 'true'
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
        run: |
          # Gemfury answers 409 when this exact package version is already
          # there — which is what every re-run of this job sees, since the
          # first attempt's uploads stuck. Already-published is success for a
          # release pipeline, not failure.
          push_package() {
            local package=$1 status
            status=$(curl -sS -o /tmp/fury-response -w "%{http_code}" \
              -F package=@"$package" \
              "https://${FURY_TOKEN}@push.fury.io/${FURY_ACCOUNT}/")
            case "$status" in
              2*) echo "uploaded $(basename "$package")" ;;
              409) echo "$(basename "$package") already on Gemfury; skipping" ;;
              *)
                echo "upload of $(basename "$package") failed with HTTP $status:" >&2
                cat /tmp/fury-response >&2
                return 1
                ;;
            esac
          }
          for package in dist/*.deb dist/*.rpm; do
            push_package "$package"
          done


  desktop:
    name: desktop ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
            bundles: dmg
          - os: ubuntu-24.04
            platform: linux-x86_64
            bundles: appimage,deb,rpm
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch pre-built static libduckdb
        run: ./scripts/fetch-duckdb.sh

      - name: Linux webkit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install UI deps
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Build desktop app (ad-hoc signed on macOS)
        working-directory: ui
        env:
          # "-" = macOS ad-hoc signature: no Apple developer certificate
          # needed; users bypass Gatekeeper with right-click → Open.
          APPLE_SIGNING_IDENTITY: "-"
        run: bun run tauri build --bundles ${{ matrix.bundles }}

      - name: Collect artifacts
        run: |
          TAG="${RELEASE_TAG}"
          mkdir -p out
          BUNDLE=ui/src-tauri/target/release/bundle
          if [ "${{ matrix.platform }}" = "macos-arm64" ]; then
            cp "$BUNDLE"/dmg/*.dmg "out/otelview-desktop-${TAG}-macos-arm64.dmg"
          else
            cp "$BUNDLE"/appimage/*.AppImage "out/otelview-desktop-${TAG}-linux-x86_64.AppImage"
            cp "$BUNDLE"/deb/*.deb "out/otelview-desktop-${TAG}-linux-x86_64.deb"
            cp "$BUNDLE"/rpm/*.rpm "out/otelview-desktop-${TAG}-linux-x86_64.rpm"
          fi
          (cd out && shasum -a 256 * > SHA256SUMS-desktop-${{ matrix.platform }}.txt)

      - name: Check Gemfury secrets
        if: runner.os == 'Linux'
        id: gemfury
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
        run: |
          if [ -n "$FURY_TOKEN" ] && [ -n "$FURY_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Gemfury secrets not set; skipping package upload"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: out/*
          generate_release_notes: true
      - name: Push desktop deb and rpm to Gemfury
        if: runner.os == 'Linux' && steps.gemfury.outputs.available == 'true'
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
        run: |
          # Gemfury answers 409 when this exact package version is already
          # there — which is what every re-run of this job sees, since the
          # first attempt's uploads stuck. Already-published is success for a
          # release pipeline, not failure.
          push_package() {
            local package=$1 status
            status=$(curl -sS -o /tmp/fury-response -w "%{http_code}" \
              -F package=@"$package" \
              "https://${FURY_TOKEN}@push.fury.io/${FURY_ACCOUNT}/")
            case "$status" in
              2*) echo "uploaded $(basename "$package")" ;;
              409) echo "$(basename "$package") already on Gemfury; skipping" ;;
              *)
                echo "upload of $(basename "$package") failed with HTTP $status:" >&2
                cat /tmp/fury-response >&2
                return 1
                ;;
            esac
          }
          BUNDLE=ui/src-tauri/target/release/bundle
          for package in "$BUNDLE"/deb/*.deb "$BUNDLE"/rpm/*.rpm; do
            push_package "$package"
          done

