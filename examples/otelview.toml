# otelview example configuration (TOML) — same shape as the YAML file.

[receivers.grpc]
enabled = true
listen = "0.0.0.0:4317"

[receivers.http]
enabled = true
listen = "0.0.0.0:4318"

[auth]
header = "x-otelview-token"
# token = "sekret"
protect_api = false

[storage]
backend = "remote"           # traces+logs+metrics from another otelview
# Delete telemetry older than this (36h, 7d, 2w, 1mo). Unset keeps
# everything. Honoured by the duckdb backend; a remote backend's server
# manages its own retention.
# retention = "7d"
# retention_sweep_interval = "1h"

[storage.remote]
endpoint = "http://other-host:4317"
auth_header = "x-otelview-token"
# auth_token = "sekret"

[ui]
listen = "127.0.0.1:4319"
cors = true
# token = "ui-sekret"      # optional: require this token to use the web UI

# Single sign-on. Off by default; the whole section can be omitted.
# A complete, runnable setup lives in examples/zitadel/.
# [auth.oidc]
# enabled = true
# issuer = "https://auth.example.com"
# client_id = "otelview-web"
# redirect_url = "https://otelview.example.com/auth/callback"
# scopes = ["openid", "profile", "email"]
# viewer_roles = ["otelview.viewer"]
# admin_roles = ["otelview.admin"]
# OTELVIEW_OIDC_CLIENT_SECRET overrides client_secret, for confidential
# clients and token introspection.

[mcp]
enabled = true             # serve MCP for AI agents on the UI port
path = "/mcp"
# Bearer token required on every MCP request. Unset falls back to
# ui.token, then auth.token when protect_api is on. OTELVIEW_MCP_TOKEN
# overrides it, so the secret need not live in this file.
# token = "agent-sekret"
