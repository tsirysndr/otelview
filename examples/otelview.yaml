# otelview example configuration (YAML). Every field is optional — these are
# the defaults except where commented.
receivers:
  grpc:
    enabled: true
    listen: "0.0.0.0:4317"
  http:
    enabled: true
    listen: "0.0.0.0:4318"

auth:
  header: x-otelview-token
  # token: sekret            # uncomment to require the header on ingest
  protect_api: false

storage:
  backend: duckdb            # memory | duckdb | jaeger | remote
  # Delete telemetry older than this (36h, 7d, 2w, 1mo — months are 30
  # days). Unset keeps everything forever. Honoured by the duckdb backend;
  # the remote postgres storage has its own RETENTION knob.
  retention: 7d
  retention_sweep_interval: 1h
  duckdb:
    path: otelview.duckdb
  memory:
    max_spans: 200000
    max_logs: 200000
    max_metric_points: 500000

ui:
  listen: "127.0.0.1:4319"
  cors: true
  # token: ui-sekret       # optional: require this token to use the web UI

log_level: info
