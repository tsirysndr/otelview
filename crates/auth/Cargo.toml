[package]
name = "otelview-auth"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
otelview-config = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
jsonwebtoken = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[features]
# A mock identity provider for integration tests, in this crate so that
# every crate guarded by it can test against the same one.
testing = []

[dev-dependencies]
otelview-auth = { path = ".", features = ["testing"] }
http-body-util = "0.1"
tower = { workspace = true, features = ["util"] }
