[workspace]
resolver = "2"
members = [
    "crates/model",
    "crates/config",
    "crates/storage",
    "crates/receiver",
    "crates/api",
    "crates/auth",
    "crates/mcp",
    "crates/otelview",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tsirysndr/otelview"

[workspace.dependencies]
otelview-model = { path = "crates/model" }
otelview-config = { path = "crates/config" }
otelview-storage = { path = "crates/storage" }
otelview-receiver = { path = "crates/receiver" }
otelview-api = { path = "crates/api" }
otelview-auth = { path = "crates/auth" }
otelview-mcp = { path = "crates/mcp" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
toml = "0.9"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-gzip"] }
tonic = "0.14"
prost = "0.14"
opentelemetry-proto = { version = "0.33", default-features = false, features = [
    "gen-tonic",
    "trace",
    "logs",
    "metrics",
    "with-serde",
] }
# Statically linked against the pre-built libduckdb static bundle from GitHub
# releases — run scripts/fetch-duckdb.sh once before building. DuckDB is never
# compiled locally (no "bundled" feature) and the binary stays self-contained.
duckdb = { version = "1.10505" }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "json",
] }
rust-embed = "8"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
bytes = "1"
flate2 = "1"
mime = "0.3"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# MCP is JSON-RPC 2.0: jsonrpsee owns dispatch, params and error objects,
# while the transports (stdio, HTTP) stay ours — server-core is the module
# without the bundled listener.
jsonrpsee = { version = "0.26", default-features = false, features = [
    "server-core",
    "jsonrpsee-types",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "gzip",
    "rustls-tls",
] }
# Identity: otelview is an OIDC relying party, so it verifies tokens and
# reads claims. Everything else — SAML, MFA, passkeys, user management —
# belongs to the provider it delegates to.
# `rust_crypto` rather than aws-lc-rs: this binary cross-compiles to three
# targets and is linked statically, and a pure-Rust backend keeps a C
# toolchain out of that.
jsonwebtoken = { version = "11", default-features = false, features = [
    "rust_crypto",
    "use_pem",
] }
base64 = "0.23"
sha2 = "0.11"
hmac = "0.13"

[profile.release]
lto = "thin"
strip = true
opt-level = 3
